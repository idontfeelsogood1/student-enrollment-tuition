services:
  mysql:
    image: mysql:8.4
    container_name: set-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Cần đặt biến DB_PASSWORD}
      MYSQL_DATABASE: university_db
    ports:
      - "3306:3306"
    volumes:
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
